version: '3'

services:
  fraud-detection:
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - OUTPUT_DIR=/app/outputs
    # Use one of these commands as needed
    command: python -m src.data_generation  # Generate data
    # command: python -m src.training       # Train models
    # command: python -m src.final_models   # Evaluate models
